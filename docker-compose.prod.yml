version: '3.9'

# Production stack for a single self-managed host (e.g. an Oracle Cloud
# Always Free VM). Postgres and Redis are NOT published to the host — only
# Caddy is, and it terminates TLS (via Let's Encrypt) and reverse-proxies to
# the backend/ui containers over the internal docker network.
#
# Images are built in CI (.github/workflows/publish.yml) and pushed to
# GHCR — this file only ever pulls them. Building backend/ui in place on a
# 1 OCPU / 1GB Oracle Free-tier host starves the live containers of
# CPU/memory badly enough to cause real request timeouts while it runs
# (confirmed live on 2026-08-05) — don't add `build:` back here.
#
# Usage:
#   PUBLIC_DOMAIN=sentinel.yourdomain.com docker compose -f docker-compose.prod.yml pull
#   PUBLIC_DOMAIN=sentinel.yourdomain.com docker compose -f docker-compose.prod.yml up -d
#
# See docs/ORACLE_DEPLOY.md for full setup instructions.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER:-thatisshayan}/project-sentinel-backend:${IMAGE_TAG:-latest}
    # Without this, `node dist/index.js` runs as PID 1 inside the container.
    # PID 1 is responsible for reaping re-parented orphan/zombie processes,
    # a job Node.js doesn't do — a git subprocess that exits under some edge
    # case (e.g. a timed-out clone) was left as a permanent zombie instead
    # of being cleaned up. `init: true` runs a real init (tini) as PID 1.
    # Confirmed live: 81 accumulated `[git] <defunct>` zombies on 2026-08-05.
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: ghcr.io/${GHCR_OWNER:-thatisshayan}/project-sentinel-ui:${IMAGE_TAG:-latest}
    init: true
    env_file:
      - ./ui/.env
    environment:
      NODE_ENV: production
      SENTINEL_API_URL: http://backend:3000
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ui
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
