name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Weekly OWASP dependency check (Monday 3am UTC)

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage

      # Security: npm audit (fail on high/critical)
      - name: Security audit (npm)
        run: npm audit --audit-level=high --production
        continue-on-error: false

      # Security: gitleaks secret scan
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-scheduled:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

      # OWASP Dependency Check (weekly)
      # Pinned to immutable SHA 1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c (was @main — see 2026-07-26 audit H-3)
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        id: depcheck
        with:
          project: 'Sentinel Backend'
          path: '.'
          format: 'JSON'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --suppressionFile ../.github/dependency-check-suppressions.xml

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-reports
          path: backend/reports/

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SENTINEL_API_URL: http://localhost:3000
          SENTINEL_UI_KEY: ci-placeholder

  # The backend/ui jobs above run npm directly on the runner's Node (pinned to
  # '20' regardless of what backend/Dockerfile or ui/Dockerfile actually pin —
  # a Dockerfile-only change (e.g. bumping the base image) can go fully green
  # here while the real Docker build silently breaks. This job closes that gap
  # by actually invoking `docker build` against each service's own Dockerfile,
  # on the ubuntu-latest runner's built-in Docker daemon (no extra setup
  # needed). backend/Dockerfile is what .github/workflows/publish.yml builds
  # and pushes to GHCR for production (see docs/ORACLE_DEPLOY.md) — this repo
  # has already had one
  # severe incident (see git history: "production container has been
  # crash-looping since the TS migration") from exactly this class of change
  # reaching main unverified.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ui]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.service }} Docker image
        run: docker build -t "sentinel-${{ matrix.service }}:ci" "./${{ matrix.service }}"