name: publish

# Builds backend/ui images once, in CI, and pushes them to GHCR — so the
# Oracle deploy host only ever has to `docker pull`, never `docker build`.
# That VM is a 1 OCPU / 1GB Oracle Free-tier instance; building in place
# there (pip/npm installs, TypeScript compile) starves the live containers
# of CPU/memory badly enough to cause real request timeouts and DB
# connection drops while it runs — confirmed live on 2026-08-05.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, ui]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image owner
        id: owner
        # GHCR rejects uppercase in image names; github.repository_owner
        # preserves the repo's actual casing (Thatisshayan), so lowercase it
        # explicitly rather than assuming.
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/project-sentinel-${{ matrix.service }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/project-sentinel-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
