name: governance-gate

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate (secret-scan, doc-freshness, build, test, deploy-dry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install UI dependencies
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm install --prefix ui --no-fund --no-audit

      - name: Build UI
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: npm run build --prefix ui

      - name: Run UI e2e smoke
        if: ${{ hashFiles('ui/package.json') != '' }}
        run: node ui/scripts/e2e-smoke.mjs

      - name: Setup Python
        if: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run governance verification
        run: bash scripts/verify.sh
