name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (default: feat/phase6-arch-refactor)'
        required: false
        default: 'feat/phase6-arch-refactor'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379
      GITHUB_WEBHOOK_SECRET: test-secret
      NOTION_API_KEY: test-key
      NOTION_DATABASE_ID: test-db-id
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_CHAT_ID: '123456'
      DEBUGGER_SHARED_SECRET: debug-secret
      NVIDIA_API_KEY: test-nvidia-key
      GEMINI_API_KEY: test-gemini-key
      DASHSCOPE_API_KEY: test-dashscope-key
      DEEPSEEK_API_KEY: test-deepseek-key
      AUDIT_AGENT_ENABLED: 'false'
      BUILDER_AGENT_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || 'feat/phase6-arch-refactor' }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests (with mock DB/Redis - will skip integration-only tests)
        working-directory: backend
        run: npm run test

      - name: Integration test summary
        run: |
          echo "Integration tests require Docker."
          echo "Options:"
          echo "  1. Install Docker Desktop locally and run: npm run test:integration"
          echo "  2. Use the test-integration.yml workflow on a self-hosted runner with Docker"
